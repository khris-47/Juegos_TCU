<!doctype html>
<html lang="en">

<head>
    <title>Adivinanza</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles/modals.css">
    <link rel="stylesheet" href="styles/Adivinanza.css">

    <link rel="icon" type="image/x-icon" href="./img/Logo.png" />
</head>

<body>

    <div class="mute-button-container">

            <!-- From Uiverse.io by faxriddin20 -->
            <input id="checkboxInput" type="checkbox" />
            <label class="toggleSwitch" for="checkboxInput">
                <div class="speaker">
                    <svg viewBox="0 0 75 75" version="1.0" xmlns="http://www.w3.org/2000/svg">
                        <path style="stroke:#fff;stroke-width:5;stroke-linejoin:round;fill:#fff;"
                            d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z">
                        </path>
                        <path style="fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round"
                            d="M48,27.6a19.5,19.5 0 0 1 0,21.4M55.1,20.5a30,30 0 0 1 0,35.6M61.6,14a38.8,38.8 0 0 1 0,48.6">
                        </path>
                    </svg>
                </div>

                <div class="mute-speaker">
                    <svg stroke-width="5" stroke="#fff" viewBox="0 0 75 75" version="1.0">
                        <path stroke-linejoin="round" fill="#fff" d="m39,14-17,15H6V48H22l17,15z"></path>
                        <path stroke-linecap="round" fill="#fff" d="m49,26 20,24m0-24-20,24"></path>
                    </svg>
                </div>
            </label>
            
    </div>

    <div id="pantalla-overlay"></div>

    <main class="d-flex align-items-center justify-content-center">


        <div class="capa"></div>


        <img alt="" class="background-image" src="./img/fondos/fondo_memoramas.png" />


        <div class="container zona-juego" style="z-index: 2;">


            <h2 id="palabraMostrar" class="text-white mb-3"></h2>

            <div id="dropZone" class="drop-zone"></div>

            <div class="d-flex justify-content-around mt-4" id="opcionesContainer"></div>
            <div class="text-white mt-4" id="resultado"></div>

        </div>
    </main>

    <!-- Modal Felicitaciones -->
    <div class="modal fade" id="ModalFelicitaciones" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-felicitaciones">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel"><b>Felicitaciones!!! 🥳🥳</b></h1>
                </div>
                <div class="modal-body" id="ModalBody">


                </div>
                <div class="modal-footer">
                    <a href="./seleccion.html" class="btn btn-dark">Menu</a>
                    <button type="button" class="btn btn-primary" onclick="location.reload()">Volver a
                        intentar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Derrota -->
    <div class="modal fade" id="ModalDerrota" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content  modal-derrota">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel"><b>¡Casi lo logras! 😢</b></h1>
                </div>
                <div class="modal-body" id="ModalBodyDerrota">
                    <p>Te has quedado sin intentos 😢</p>
                    <p> Puedes volver a intentarlo y demostrar que de lo que estas hecho 💪😎</p>
                    <p> <b>Muchas gracias por jugar, esperamos que te hayas divertido 🥰</b></p>
                </div>
                <div class="modal-footer">
                    <a class="btn btn-dark" href="./seleccion.html">Menu</a>
                    <button type="button" class="btn btn-primary" onclick="location.reload()">Volver a
                        intentar</button>
                </div>
            </div>
        </div>
    </div>


    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>

    <script src="functions/Tercero.js" type="module">

    </script>


    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>

</html>
